# CI/CD de Atlas — integración continua (calidad) y entrega continua (imágenes Docker).
# El pipeline de seguridad (secretos, SAST, SCA, DAST, k6, gate) vive aparte en devsecops.yml.
#
#   CI  : frontend (lint + build) · backend (instalación reproducible + sintaxis) · imágenes Docker (build)
#   CD  : en push a main o tag v*, publica las imágenes en GitHub Container Registry (ghcr.io)
name: ci-cd-atlas

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela corridas viejas de la misma rama para no gastar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  # ---------- CI ----------
  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodigoFuenteA/FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CodigoFuenteA/FRONTEND/package-lock.json
      - run: npm ci
      # El código base trae 8 errores de ESLint previos (variables `error` sin usar). No se corrigen
      # porque es el código evaluado en EP3; se reportan sin bloquear. Cuando se limpien, quitar continue-on-error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: CodigoFuenteA/FRONTEND/dist
          retention-days: 7

  backend:
    name: Backend · dependencias y sintaxis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodigoFuenteA/BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: CodigoFuenteA/BACKEND/package-lock.json
      - run: npm ci
      - name: Verificar que todos los archivos JS compilan
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verificar que openapi.json es JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('src/openapi.json','utf8'))"
      # Cuando existan pruebas unitarias: agregar "test" a package.json y descomentar.
      # - run: npm test --if-present

  # ---------- Build de imágenes (CI) y publicación (CD) ----------
  imagenes:
    name: Imágenes Docker (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: backend
            contexto: CodigoFuenteA/BACKEND
          - servicio: frontend
            contexto: CodigoFuenteA/FRONTEND
    env:
      # Solo se publica desde main o tags; en pull requests la imagen se construye pero no se sube.
      PUBLICAR: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGEN=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: env.PUBLICAR == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La URL de la API se fija al construir el frontend (Vite). Se define en Settings > Variables.
          build-args: |
            ${{ matrix.servicio == 'frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL || 'http://localhost:4450') || '' }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # Entorno completo con Docker Compose: levanta, espera salud y verifica que responde.
  humo:
    name: Prueba de humo (docker compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar Atlas
        run: |
          mkdir -p CodigoFuenteA/BACKEND/uploads
          docker compose -f CodigoFuenteA/docker-compose.yml up --build -d
      - name: Esperar a la API y al frontend
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:4450/docs/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4450/docs/ >/dev/null
          curl -sf http://localhost:3350/ >/dev/null
      - name: Logs si falla
        if: failure()
        run: docker compose -f CodigoFuenteA/docker-compose.yml logs --tail=100
      - name: Apagar
        if: always()
        run: docker compose -f CodigoFuenteA/docker-compose.yml down -v
